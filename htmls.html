<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaTODOList</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <h1>MaTODOList</h1>
    </header>


    <!-- CONTENU PRINCIPAL -->
    <main>

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h2>Menu</h2>

            <nav>
                <ul>
                    <li>
                        <a href="#current-task">
                            Current Task
                        </a>
                    </li>

                    <li>
                        <a href="#completed-task">
                            Completed Task
                        </a>
                    </li>
                </ul>
            </nav>

        </aside>


        <!-- PARTIE DROITE -->
        <div class="content-container">

            <!-- CONTENT -->
            <section class="content">

                <h2>Content</h2>

                <p>
                    Welcome to MaTODOList!
                </p>

            </section>


            <!-- ADD TASK -->
            <section class="add-task">

                <h2>Add Task</h2>

                <form class="add-task-form">

                    <input
                        type="text"
                        class="task-input"
                        placeholder="New task"
                    >

                    <button
                        type="submit"
                        class="add-task-button"
                    >
                        Add
                    </button>

                </form>

            </section>


            <!-- CURRENT TASK -->
            <section
                class="current-task"
                id="current-task"
            >

                <h2>Current Task</h2>

                <ul class="task-list">
                    <li>1st task</li>
                    <li>2nd task</li>
                    <li>3rd task</li>
                </ul>

            </section>


            <!-- COMPLETED TASK -->
            <section
                class="completed-task"
                id="completed-task"
            >

                <h2>Completed Task</h2>

                <ul class="task-list">
                    <li>4th task</li>
                </ul>

            </section>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <p>
            &copy; 2026 MaTODOList. All rights reserved.
        </p>

    </footer>

</body>

</html>

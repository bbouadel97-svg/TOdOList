<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    </header>

    <main>

        <section class="sidebar">
            <h2>Menu</h2>

            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Current Tasks</a></li>
                    <li><a href="#">Completed Tasks</a></li>
                    <li><a href="#">Add Task</a></li>
                </ul>
            </nav>

        </section>
        <div class="content-container">
        <section class="content">
            <h2>Content</h2>
            <p>Welcome to the content section!</p>
        </section>

        <section class="add-task">
            <h2>Add Task</h2>
            <form class="add-task-form">
                <input type="text" class="task-input" placeholder="New task">
                <button type="submit" class="add-task-button">Add</button>
            </form>
        </section>
        <section class="current-task">
            <h2>Current Task</h2>
            <ul class="task-list">
            </ul>
        </section>

        <section class="completed-task">
            <h2>Completed Task</h2>
            <ul class="task-list">
            </ul>
        </section>
        </div>
    </main>
    <footer class="bottom-bar">
        <div class="account">
            Account
        </div>

        <div class="other-section">
            Other Section
        </div>

        <div class="settings">
            Settings
        </div>

        <div class="help">
            Help
        </div>

    </footer>
         
</body>
</html>

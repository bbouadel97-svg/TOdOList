<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Ma To-Do List</title>
   <link rel="stylesheet" href="style.css">
   <link rel="icon" href="images/favicon.ico" type="image/x-icon">
   <link rel="icon" href="images/logo.png" type="image/x-icon">

   
</head>

<script>
    const bouton = document.getElementById('toggle-btn');
    if (bouton) {
        bouton.addEventListener('click', () => {
            const sectionDroite = document.querySelector('.droite');
            sectionDroite.classList.toggle('hidden');
        });
    }
</script>
<body>
        <header>
               <h1>Ma To-Do List</h1>
               <img src="images/logo.png" alt="Logo">
    </header>
   <main>

    
    <section class="gauche">
        <h2>Tranches d'âge</h2>
        <label for="Tranche d'age">Choisissez une tranche&nbsp;:</label>

        <select name="tranche" id="age-select">
            <option value="">--Veuillez choisir une option--</option>
            <option value="6-10">6-10 ans</option>
            <option value="11-15">11-15 ans</option>
            <option value="16-25">16-25 ans</option>
            <option value="26-60">26-60 ans</option>
            <option value="+60">60+ ans</option>
        </select>

        <article class="profil">
            <img src="images/adulte.png" alt="Adulte">
            <h2>Adulte</h2>
        </article>

        <article class="profil">
            <img src="images/child.png" alt="Child">
            <h2>Child</h2>
        </article>

    </section>

    <section class="centre">    
        <h2>Tasks</h2>
        <ul>

            <li>Ranger sa chambre</li>
            <li>Faire les devoirs</li>
            <li>Monter le linge</li>

        </ul>
    </section>
    <section class="droite">
        <h2>Ajouter une tâche</h2>
        <button>Add New Task</button>
        <input type="text" placeholder="New Task">
        <button class="btn-plus" aria-label="Ajouter">+</button>
    </section>
    
   </main>
</body>
</html>
